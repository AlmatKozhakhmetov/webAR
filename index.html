<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>WebAR ГРПШ Проект</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">

    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <a-assets>
            <a-asset-item id="grpsh-model" src="model.gltf"></a-asset-item>
            
            </a-assets>

        <a-marker type="pattern" url="company-logo.patt">
            
            <a-entity light="type: ambient; color: #FFF; intensity: 0.8"></a-entity>
            <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-1 2 1"></a-entity>

            <a-entity 
                gltf-model="#grpsh-model" 
                position="0 0 0" 
                scale="0.2 0.2 0.2" 
                rotation="0 0 0">
            </a-entity>

            </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

</body>
</html>
